<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Family Dash">

<title>Family Dash</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: #101116;
  color: white;
}

.slide {
  display: none;
  width: 100%;
  height: 100%;
  padding: 7vh 7vw;
  align-items: center;
  justify-content: center;
  text-align: center;
}

.slide.active {
  display: flex;
}

.content {
  width: 100%;
  max-width: 1200px;
}

.emoji {
  font-size: 90px;
  margin-bottom: 20px;
}

h1 {
  font-size: clamp(45px, 8vw, 100px);
  margin: 10px 0 25px;
}

p {
  font-size: clamp(25px, 4vw, 50px);
  margin: 15px 0;
}

.small {
  font-size: 22px;
  opacity: 0.65;
}

.cards {
  display: flex;
  justify-content: center;
  gap: 25px;
  flex-wrap: wrap;
}

.card {
  background: rgba(255,255,255,0.12);
  border-radius: 30px;
  padding: 35px 45px;
  min-width: 250px;
  font-size: 32px;
}

.clock {
  font-size: clamp(90px, 17vw, 220px);
  font-weight: 700;
  line-height: 1;
}

.date {
  font-size: clamp(28px, 4vw, 55px);
  margin-top: 35px;
}
</style>
</head>

<body>

<!-- WEATHER -->
<section class="slide active">
  <div class="content">
    <div class="emoji">🌤️</div>
    <h1>Doha</h1>
    <p id="weather">Cargando tiempo…</p>
  </div>
</section>

<!-- CALENDAR -->
<section class="slide">
  <div class="content">
    <div class="emoji">📅</div>
    <h1>Calendario</h1>
    <p>Hoy</p>
    <p class="small">
      Aquí añadiremos tu calendario familiar de Apple.
    </p>
  </div>
</section>

<!-- FAMILY -->
<section class="slide">
  <div class="content">
    <div class="emoji">👨‍👩‍👧‍👧</div>
    <h1>Familia</h1>

    <div class="cards">

      <div class="card">
        👧 Noa
        <br>
        <span class="small">Colegio · Gimnasia</span>
      </div>

      <div class="card">
        👧 Alba
        <br>
        <span class="small">Colegio · Actividades</span>
      </div>

      <div class="card">
        🏠 Casa
        <br>
        <span class="small">Tareas · Recordatorios</span>
      </div>

    </div>
  </div>
</section>

<!-- CLOCK -->
<section class="slide">
  <div class="content">
    <div class="clock" id="clock"></div>
    <div class="date" id="date"></div>
  </div>
</section>

<script>

const slides = document.querySelectorAll(".slide");

let current = 0;

function nextSlide() {

  slides[current].classList.remove("active");

  current++;

  if (current >= slides.length) {
    current = 0;
  }

  slides[current].classList.add("active");
}

/* Cambia de pantalla cada 12 segundos */

setInterval(nextSlide, 12000);


/* También puedes tocar la pantalla para cambiar */

document.body.addEventListener("click", nextSlide);


/* RELOJ */

function updateClock() {

  const now = new Date();

  document.getElementById("clock").textContent =
    now.toLocaleTimeString("es-ES", {
      hour: "2-digit",
      minute: "2-digit"
    });

  document.getElementById("date").textContent =
    now.toLocaleDateString("es-ES", {
      weekday: "long",
      day: "numeric",
      month: "long"
    });
}

updateClock();

setInterval(updateClock, 1000);


/* TIEMPO DE DOHA */

async function updateWeather() {

  try {

    const response = await fetch(
      "https://api.open-meteo.com/v1/forecast?latitude=25.2854&longitude=51.5310&current=temperature_2m,weather_code&timezone=Asia%2FQatar"
    );

    const data = await response.json();

    const temperature =
      Math.round(data.current.temperature_2m);

    const code =
      data.current.weather_code;

    const descriptions = {

      0: "☀️ Despejado",
      1: "🌤️ Principalmente despejado",
      2: "⛅ Parcialmente nublado",
      3: "☁️ Nublado",
      45: "🌫️ Niebla",
      48: "🌫️ Niebla",
      51: "🌦️ Llovizna",
      61: "🌧️ Lluvia",
      63: "🌧️ Lluvia",
      80: "🌦️ Chubascos",
      81: "🌦️ Chubascos",
      95: "⛈️ Tormenta"

    };

    document.getElementById("weather").textContent =
      temperature + " °C · " +
      (descriptions[code] || "Tiempo actual");

  } catch

    document.getElementById("weather").
updateWeather();

setInterval(updateWeather, 600000);

</script>

</body>
</html>
